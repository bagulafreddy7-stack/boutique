<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion de boutique – démo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#12263a;--mut:#5d6b7a;--ac:#0f8a6d;--acx:#fff;--bd:#d9dfe6;--red:#c9371c;--soft:#e3f3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#18232f;--tx:#e8eef4;--mut:#93a3b3;--ac:#3ec9a3;--acx:#06211a;--bd:#2a3846;--red:#ff7a5c;--soft:#173a32}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#18232f;--tx:#e8eef4;--mut:#93a3b3;--ac:#3ec9a3;--acx:#06211a;--bd:#2a3846;--red:#ff7a5c;--soft:#173a32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--tx);padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--acx);font-weight:700}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:11px 4px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.it{text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px;font:inherit;cursor:pointer}
.it b{display:block}
.it span{font-size:13px;color:var(--mut)}
.low{color:var(--red)!important;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;cursor:pointer}
.big{font-size:22px;font-weight:700}
.pay{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pay button,.cu{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}
.pay button.on,.cu.on{background:var(--soft);border-color:var(--ac);font-weight:700}
.go{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.msg{color:var(--ac);font-weight:700;margin:8px 0 0}
a.wa{display:block;text-align:center;margin-top:8px;padding:12px;border-radius:10px;background:#25a244;color:#fff;text-decoration:none;font-weight:700}
.k{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.k small{color:var(--mut);display:block}
.k strong{font-size:18px}
.note{font-size:13px;color:var(--mut);margin-top:14px}
.add{display:grid;gap:8px;margin:10px 0}
.acts{display:flex;gap:8px;padding-bottom:10px}
.acts a.wa{flex:1;margin:0;padding:9px;font-size:14px}
.acts a.call{background:var(--ac);color:var(--acx)}
.muted{color:var(--mut)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var LOW=5;
var M={
kigali:{cur:"RWF",momo:"MTN MoMo / Airtel Money",
items:[],
cust:[]},
rdc:{cur:"CDF",momo:"M-Pesa / Airtel Money / Orange Money",
items:[],
cust:[]}
};
var D={
fr:{app:"Gestion de boutique",sell:"Vente",stock:"Stock",debts:"Dettes",report:"Bilan",search:"Chercher un article (ex. Sav)",cart:"Panier",empty:"Touchez un article pour l’ajouter.",total:"Total",cash:"Espèces",credit:"Crédit",who:"Quel client ?",validate:"Valider la vente",done:"Vente enregistrée ✓",left:"en stock",low:"Stock bas",value:"Valeur",nobody:"Aucune dette pour l’instant. Faites une vente à crédit dans l’onglet Vente.",pick:"Touchez un client pour voir sa fiche.",repay:"Enregistrer le remboursement",amount:"Montant reçu",remind:"Envoyer un rappel WhatsApp",balance:"Solde restant",sales:"Ventes du jour",outside:"Argent dehors (crédits)",top:"Produit le plus vendu",paid:"Remboursement enregistré ✓",stockTotal:"Valeur totale du stock",noSale:"Aucune vente pour l’instant",note:"Données enregistrées sur cet appareil. L’outil enregistre le mode de paiement ; il ne fait pas le paiement lui-même.",units:"vendus",oweTxt:"doit",nm:"Nom",cname:"Nom du nouveau client",ctel:"Téléphone WhatsApp (ex. +250…)",add:"Ajouter le client",noItems:"Aucun article. Ajoutez vos produits dans l’onglet Stock.",newItem:"Ajouter ou réapprovisionner un article (même nom = quantité ajoutée)",pname:"Nom de l’article",pprice:"Prix de vente",pqty:"Quantité en stock",addItem:"Enregistrer l’article",del:"Supprimer",call:"Appeler"},
en:{app:"Shop manager",sell:"Sale",stock:"Stock",debts:"Debts",report:"Summary",search:"Find an item (e.g. Soa)",cart:"Cart",empty:"Tap an item to add it.",total:"Total",cash:"Cash",credit:"Credit",who:"Which customer?",validate:"Confirm sale",done:"Sale saved ✓",left:"in stock",low:"Low stock",value:"Value",nobody:"No debts yet. Make a credit sale in the Sale tab.",pick:"Tap a customer to open their record.",repay:"Save repayment",amount:"Amount received",remind:"Send a WhatsApp reminder",balance:"Balance left",sales:"Today’s sales",outside:"Money owed (credit)",top:"Best-selling item",paid:"Repayment saved ✓",stockTotal:"Total stock value",noSale:"No sales yet",note:"Data is saved on this device. The tool records the payment method; it does not process the payment itself.",units:"sold",oweTxt:"owes",nm:"Name",cname:"New customer name",ctel:"WhatsApp number (e.g. +250…)",add:"Add customer",noItems:"No items yet. Add your products in the Stock tab.",newItem:"Add or restock an item (same name = quantity added)",pname:"Item name",pprice:"Selling price",pqty:"Quantity in stock",addItem:"Save item",del:"Delete",call:"Call"}
};
var st={market:"kigali",lang:"fr",tab:"sell",q:"",cart:{},pay:null,cust:null,sel:null,msg:"",stock:{},debts:{},sales:[],fq:false};
var h=(location.hash||"").replace("#","");
function load(m){st.market=m;var c=M[m],d=null;try{d=JSON.parse(localStorage.getItem("boutique-"+m)||"null")}catch(e){}
c.items=d?d.items:[];c.cust=d?d.cust:[];st.stock=d?d.stock:{};st.debts=d?d.debts:{};st.sales=d?d.sales:[];st.cart={};st.pay=null;st.cust=null;st.sel=null;st.msg="";st.q="";}
function save(){try{localStorage.setItem("boutique-"+st.market,JSON.stringify({items:M[st.market].items,cust:M[st.market].cust,stock:st.stock,debts:st.debts,sales:st.sales}))}catch(e){}}
load(h==="rdc"?"rdc":"kigali");
var el=document.getElementById("app");
function t(k){return D[st.lang][k]}
function money(n){return n.toLocaleString(st.lang==="fr"?"fr-FR":"en-US")+" "+M[st.market].cur}
function nm(i){return st.lang==="fr"?i[1]:i[2]}
function item(id){return M[st.market].items.filter(function(i){return i[0]===id})[0]}
function cust(id){return M[st.market].cust.filter(function(c){return c[0]===id})[0]}
function cartTotal(){var s=0;for(var id in st.cart){s+=item(id)[3]*st.cart[id]}return s}
function totalDebt(){var s=0;for(var id in st.debts){s+=st.debts[id]}return s}
function seg(a,opts,cur){return '<div class="seg">'+opts.map(function(o){return '<button data-a="'+a+'" data-v="'+o[0]+'" class="'+(cur===o[0]?"on":"")+'">'+o[1]+'</button>'}).join("")+'</div>'}
function addForm(){return '<div class="add"><input type="text" id="nc" placeholder="'+t("cname")+'" autocomplete="off"><input type="text" id="np" placeholder="'+t("ctel")+'" autocomplete="off"><button class="cu" data-a="addc">+ '+t("add")+'</button></div>'}
function vSell(){
var c=M[st.market],q=st.q.toLowerCase(),tot=cartTotal();
var list=c.items.filter(function(i){return nm(i).toLowerCase().indexOf(q)>-1}).map(function(i){var s=st.stock[i[0]]-(st.cart[i[0]]||0);return '<button class="it" data-a="add" data-v="'+i[0]+'"'+(s<1?" disabled":"")+'><b>'+nm(i)+'</b><span>'+money(i[3])+'</span><br><span class="'+(s<=LOW?"low":"")+'">'+(s<=LOW?"⚠ "+t("low")+" – ":"")+s+" "+t("left")+'</span></button>'}).join("")||'<p class="muted">'+t("noItems")+'</p>';
var lines=Object.keys(st.cart).map(function(id){var i=item(id);return '<div class="row"><span>'+nm(i)+'<br><span class="sub">'+money(i[3])+'</span></span><span class="qty"><button data-a="dec" data-v="'+id+'">−</button>'+st.cart[id]+'<button data-a="inc" data-v="'+id+'">+</button></span></div>'}).join("")||'<p class="muted">'+t("empty")+'</p>';
var custs=st.pay==="credit"?'<p class="sub">'+t("who")+'</p><div class="pay">'+c.cust.map(function(x){return '<button class="cu '+(st.cust===x[0]?"on":"")+'" data-a="cust" data-v="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'+addForm():"";
var ok=tot>0&&st.pay&&(st.pay!=="credit"||st.cust);
return '<div class="box"><input type="text" id="q" value="'+st.q+'" placeholder="'+t("search")+'" autocomplete="off"><div class="grid">'+list+'</div></div>'+
'<div class="box"><b>'+t("cart")+'</b>'+lines+'<div class="row"><span>'+t("total")+'</span><span class="big">'+money(tot)+'</span></div>'+
'<div class="pay">'+[["cash",t("cash")],["momo",c.momo],["credit",t("credit")]].map(function(p){return '<button data-a="pay" data-v="'+p[0]+'" class="'+(st.pay===p[0]?"on":"")+'">'+p[1]+'</button>'}).join("")+'</div>'+custs+
'<button class="go" data-a="validate"'+(ok?"":" disabled")+'>'+t("validate")+'</button>'+(st.msg?'<p class="msg">'+st.msg+'</p>':"")+'</div>';}
function vStock(){
var c=M[st.market],tv=0;
var rows=c.items.map(function(i){var s=st.stock[i[0]];tv+=s*i[3];return '<div class="row"><span>'+nm(i)+'<br><span class="sub">'+t("value")+": "+money(s*i[3])+'</span></span><span class="'+(s<=LOW?"low":"")+'">'+(s<=LOW?"⚠ ":"")+s+' <button class="cu" data-a="delp" data-v="'+i[0]+'" aria-label="'+t("del")+'">✕</button></span></div>'}).join("");
return '<div class="box"><b>'+t("newItem")+'</b><div class="add"><input type="text" id="pn" placeholder="'+t("pname")+'" autocomplete="off"><input type="number" id="pp" min="1" placeholder="'+t("pprice")+'"><input type="number" id="ps" min="0" placeholder="'+t("pqty")+'"><button class="go" data-a="addp">'+t("addItem")+'</button></div></div><div class="box">'+rows+'<div class="row"><b>'+t("stockTotal")+'</b><b>'+money(tv)+'</b></div></div>';}
function rmsg(x,d){var n=x[1].split(" ")[0];return st.lang==="fr"?"Bonjour "+n+", petit rappel : il vous reste "+money(d)+" à régler. Merci !":"Hello "+n+", a quick reminder: you have "+money(d)+" left to pay. Thank you!"}
function vDebts(){
var c=M[st.market];
var list=c.cust.map(function(x){var d=st.debts[x[0]];var ac=(d>0&&x[2])?'<div class="acts"><a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+x[2].replace(/\D/g,"")+"?text="+encodeURIComponent(rmsg(x,d))+'">WhatsApp</a><a class="wa call" href="tel:'+x[2]+'">'+t("call")+'</a></div>':"";return '<div class="row"><button class="cu '+(st.sel===x[0]?"on":"")+'" data-a="sel" data-v="'+x[0]+'">'+x[1]+'</button><b class="'+(d>0?"low":"")+'">'+money(d)+'</b></div>'+ac}).join("");
var det="";
if(st.sel){var x=cust(st.sel),d=st.debts[st.sel];
var txt=rmsg(x,d);
det='<div class="box"><b>'+x[1]+'</b><p>'+t("balance")+' : <span class="big">'+money(d)+'</span></p><input type="number" id="amt" min="1" placeholder="'+t("amount")+'"><div style="height:8px"></div><button class="go" data-a="repay">'+t("repay")+'</button>'+(d>0&&x[2]?'<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+x[2].replace(/\D/g,"")+"?text="+encodeURIComponent(txt)+'">'+t("remind")+'</a>':"")+(st.msg?'<p class="msg">'+st.msg+'</p>':"")+'</div>';}
else det='<p class="muted">'+(totalDebt()>0?t("pick"):t("nobody"))+'</p>';
return '<div class="box">'+list+addForm()+'</div>'+det;}
function vReport(){
var tot=0,by={cash:0,momo:0,credit:0},qty={};
st.sales.forEach(function(s){if(s.d!==new Date().toDateString())return;tot+=s.total;by[s.pay]+=s.total;for(var id in s.items){qty[id]=(qty[id]||0)+s.items[id]}});
var best=Object.keys(qty).filter(function(id){return item(id)}).sort(function(a,b){return qty[b]-qty[a]})[0];
return '<div class="k"><div><small>'+t("sales")+'</small><strong>'+money(tot)+'</strong></div><div><small>'+t("outside")+'</small><strong class="'+(totalDebt()>0?"low":"")+'">'+money(totalDebt())+'</strong></div><div><small>'+t("cash")+'</small><strong>'+money(by.cash)+'</strong></div><div><small>'+M[st.market].momo.split(" / ")[0]+'…</small><strong>'+money(by.momo)+'</strong></div><div><small>'+t("credit")+'</small><strong>'+money(by.credit)+'</strong></div><div><small>'+t("top")+'</small><strong>'+(best?nm(item(best))+" ("+qty[best]+" "+t("units")+")":t("noSale"))+'</strong></div></div>';}
function render(){save();
document.documentElement.lang=st.lang;document.title=t("app")+" – "+(st.market==="rdc"?"RDC":"Kigali");
var v={sell:vSell,stock:vStock,debts:vDebts,report:vReport}[st.tab]();
el.innerHTML='<div class="top"><div><h1>'+t("app")+'</h1><div class="sub">'+(st.market==="rdc"?"RDC · CDF":"Kigali · RWF")+'</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+seg("mkt",[["kigali","Kigali"],["rdc","RDC"]],st.market)+seg("lang",[["fr","FR"],["en","EN"]],st.lang)+'</div></div><nav>'+["sell","stock","debts","report"].map(function(k){return '<button data-a="tab" data-v="'+k+'" class="'+(st.tab===k?"on":"")+'">'+t(k)+'</button>'}).join("")+'</nav>'+v+'<p class="note">'+t("note")+'</p>';
if(st.fq){var q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
el.addEventListener("input",function(e){if(e.target.id==="q"){st.q=e.target.value;st.fq=true;render()}});
el.addEventListener("click",function(e){
var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
var a=b.dataset.a,v=b.dataset.v;st.fq=false;
if(a!=="validate"&&a!=="repay")st.msg="";
if(a==="tab"){st.tab=v}
else if(a==="lang"){st.lang=v}
else if(a==="mkt"){load(v);try{location.hash=v}catch(x){}}
else if(a==="add"){st.cart[v]=(st.cart[v]||0)+1}
else if(a==="inc"){if((st.cart[v]||0)<st.stock[v])st.cart[v]++}
else if(a==="dec"){st.cart[v]--;if(st.cart[v]<1)delete st.cart[v]}
else if(a==="pay"){st.pay=v;if(v!=="credit")st.cust=null}
else if(a==="cust"){st.cust=v}
else if(a==="sel"){st.sel=v}
else if(a==="addc"){var nn=document.getElementById("nc").value.replace(/[<>&"]/g,"").trim(),tp=document.getElementById("np").value.replace(/[^\d+]/g,"");if(nn){var nid="n"+Date.now();M[st.market].cust.push([nid,nn,tp]);st.debts[nid]=0;if(st.tab==="sell")st.cust=nid;else st.sel=nid}}
else if(a==="addp"){var pn=document.getElementById("pn").value.replace(/[<>&"]/g,"").trim(),pp=+document.getElementById("pp").value,ps=+document.getElementById("ps").value||0;
if(pn&&pp>0){var ex=M[st.market].items.filter(function(i){return i[1].toLowerCase()===pn.toLowerCase()})[0];
if(ex){ex[3]=pp;st.stock[ex[0]]+=ps}else{var pid="p"+Date.now();M[st.market].items.push([pid,pn,pn,pp,ps]);st.stock[pid]=ps}}}
else if(a==="delp"){M[st.market].items=M[st.market].items.filter(function(i){return i[0]!==v});delete st.stock[v];delete st.cart[v]}
else if(a==="validate"){var tot=cartTotal();for(var id in st.cart){st.stock[id]-=st.cart[id]}
if(st.pay==="credit")st.debts[st.cust]+=tot;
st.sales.push({d:new Date().toDateString(),total:tot,pay:st.pay,items:st.cart});st.cart={};st.pay=null;st.cust=null;st.q="";st.msg=t("done")}
else if(a==="repay"){var n=+document.getElementById("amt").value;if(n>0){st.debts[st.sel]=Math.max(0,st.debts[st.sel]-n);st.msg=t("paid")}}
render();
});
render();
</script>
</body>
</html>
